let level=null,round=[],n=0,score=0,answered=false,mistakes=[];
const el=document.getElementById("screen");
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function home(){level=null;el.innerHTML='<div class="panel center"><h2>きょうは どっちに ちょうせんする？</h2><div class="levels"><button class="level" onclick="start(5)">🥕<br>5きゅう<br><small>しょきゅう</small></button><button class="level" onclick="start(4)">🍳<br>4きゅう<br><small>ちゅうきゅう</small></button></div><p class="muted">5きゅうは 100もんから ランダムに10もん！<br>4きゅうも 100もんから ランダムに10もん！</p></div>'}
function start(l){level=l;n=0;score=0;mistakes=[];
if(l===5){round=[...shuffle(beginner.filter(q=>q.category==="食生活と栄養")).slice(0,5),...shuffle(beginner.filter(q=>q.category==="調理と衛生")).slice(0,5)];round=shuffle(round)}
else {round=[...shuffle(intermediate.filter(q=>q.category==="食生活と栄養")).slice(0,5),...shuffle(intermediate.filter(q=>q.category==="調理と衛生")).slice(0,5)];round=shuffle(round)}show()}
function show(){answered=false;const q=round[n];el.innerHTML=`<button class="back" onclick="home()">← さいしょに もどる</button><p>${level}きゅう　だい ${n+1} もん / ${round.length} もん</p><div class="progress"><div style="width:${n/round.length*100}%"></div></div><section class="panel"><p class="muted">${q.category}</p><h2>${q.question}</h2><div class="choices">${q.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})">${["①","②"][i]}　${x}</button>`).join("")}</div><div id="feedback"></div></section>`}
function choose(i){if(answered)return;answered=true;const q=round[n];if(i===q.answer)score++;else mistakes.push(q);
document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});
document.getElementById("feedback").innerHTML=`<div class="feedback"><strong>${i===q.answer?"🎉 せいかい！":"🌱 おしい！"}</strong><p>${q.explanation}</p></div><button class="next" onclick="next()">${n===round.length-1?"けっかを みる 🏆":"つぎの もんだいへ →"}</button>`}
function next(){n++;if(n<round.length)show();else result()}
function result(){const points=Math.round(score/round.length*100);el.innerHTML=`<section class="panel center"><h2>🏆 けっか はっぴょう！</h2><div class="score">${points} てん！</div><p>${score}もん せいかい / ${round.length}もん</p><p>${points===100?"すごい！ しょくいく はかせ！":points>=60?"よく がんばったね！":"また ちょうせんしてね！"}</p>${mistakes.length?'<button class="next" onclick="review()">まちがえた もんだいを ふくしゅう</button>':""}<button class="next" onclick="start(${level})">もういちど あそぶ</button><button class="next" onclick="home()">ほかの きゅうに ちょうせん</button></section>`}
function review(){el.innerHTML=`<button class="back" onclick="result()">← けっかに もどる</button><section class="panel"><h2>📖 ふくしゅう</h2>${mistakes.map((q,i)=>`<div class="review"><strong>${i+1}. ${q.question}</strong><p>こたえ：${q.answer===0?"①":"②"} ${q.choices[q.answer]}</p><p>${q.explanation}</p></div>`).join("")}</section>`}
home();
</script></body></html>
