<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7dce5"><title>cotocoto おりょうりクイズ</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5f6;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;color:#65394c}.app{max-width:520px;margin:auto;min-height:100dvh;padding:18px}.hero{background:#f8dce5;border-radius:24px;text-align:center;padding:24px 12px;margin-bottom:20px}h1{font-size:26px;margin:8px 0}h2{font-size:22px;line-height:1.65}p{line-height:1.7}.panel{background:white;border-radius:22px;padding:22px;margin:16px 0}.choices{display:grid;gap:12px}.choice,.level,.next{font:inherit;font-size:19px;font-weight:700;border-radius:16px;padding:18px;border:2px solid #ecc9d5;background:white;color:#65394c;cursor:pointer;text-align:left;width:100%}.level{text-align:center;min-height:150px;background:#fff0e0}.level:nth-child(2){background:#fce3ed}.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice:disabled{opacity:1}.choice.correct{background:#d9f2e2;border-color:#5aa77b}.choice.wrong{background:#fae0e0;border-color:#d97979}.next{background:#ca6c91;color:white;text-align:center;border:0;margin-top:18px}.back{background:transparent;border:0;color:#82475f;font-size:16px;padding:10px 0}.feedback{background:#fff0f4;border-radius:16px;padding:16px;margin-top:16px}.muted{font-size:14px;color:#926779}.progress{height:9px;border-radius:10px;background:#f1d8e1;overflow:hidden}.progress div{height:100%;background:#d67b9d;transition:width .2s}.score{font-size:54px;font-weight:800;color:#cb648b;text-align:center}.center{text-align:center}.hidden{display:none}</style></head><body><main class="app"><header class="hero"><div>cotocoto</div><h1>🍓 おりょうりクイズ 🍓</h1><div>たっちして あそぼう！</div></header><div id="screen"></div><footer class="center muted">かていりょうりぎのうけんていの がくしゅうを さんこうにした オリジナルもんだいです。<br>こうしきの けんていもんだいでは ありません。</footer></main><script>
const bank={5:[['りょうりの まえに することは？',['てを あらう','あじみを する','おさらを あらう'],0,'せっけんで てを あらうと、しょくちゅうどくの よぼうに なるよ。'],['おこめを みずと いっしょに たくと なにに なる？',['ごはん','ぱん','うどん'],0,'おこめを たくと ごはんに なるよ。'],['ほうちょうを つかうとき、たべものを おさえる ては？',['ゆびを のばす','ねこの てに する','てを はなす'],1,'ゆびさきを まげて ねこの てに すると あんぜんだよ。'],['ぎゅうにゅうに おおい えいようそは？',['かるしうむ','しょくもつせんい','びたみん しー'],0,'かるしうむは ほねや はを つくるのに たいせつだよ。'],['やさいを あらう おもな りゆうは？',['いろを かえるため','つちや よごれを おとすため','あまく するため'],1,'やさいについた つちや よごれを おとそう。']],4:[['しょくちゅうどくを ふせぐ 3つの げんそくは？',['つけない・ふやさない・やっつける','あらう・きる・もる','やく・にる・むす'],0,'きんを つけない・ふやさない・やっつけることが たいせつだよ。'],['こめ 1ごうは やく なんぐらむ？',['100ぐらむ','150ぐらむ','200ぐらむ'],1,'こめ 1ごうは やく150ぐらむだよ。'],['たまごを かねつすると どうなる？',['かたまる','かならず とける','あおく なる'],0,'たまごの たんぱくしつは ねつで かたまる せいしつが あるよ。'],['こんぶに おおい うまみせいぶんは？',['いのしんさん','ぐるたみんさん','くえんさん'],1,'こんぶには ぐるたみんさんという うまみせいぶんが おおいよ。'],['れいぞうこで しょくひんを ほぞんする おもな りゆうは？',['すべての きんを ころすため','きんが ふえるのを おさえるため','えいようを ふやすため'],1,'ひくい おんどで きんが ふえるのを おさえるよ。きんが なくなる わけでは ないよ。']]};let level=null,n=0,score=0,answered=false;const el=document.getElementById('screen');function home(){level=null;el.innerHTML='<div class="panel center"><h2>きょうは どっちに ちょうせんする？</h2><div class="levels"><button class="level" onclick="start(5)">🥕<br>5きゅう<br><small>しょきゅう</small></button><button class="level" onclick="start(4)">🍳<br>4きゅう<br><small>ちゅうきゅう</small></button></div><p class="muted">それぞれ 5もん！ 100てんを めざそう！</p></div>'}function start(l){level=l;n=0;score=0;show()}function show(){answered=false;let q=bank[level][n];el.innerHTML=`<button class="back" onclick="home()">← さいしょに もどる</button><p>${level}きゅう　だい ${n+1} もん / 5 もん</p><div class="progress"><div style="width:${n*20}%"></div></div><section class="panel"><h2>${q[0]}</h2><div class="choices">${q[1].map((x,i)=>`<button class="choice" onclick="choose(${i})">${['①','②','③'][i]}　${x}</button>`).join('')}</div><div id="feedback"></div></section>`}function choose(i){if(answered)return;answered=true;let q=bank[level][n];if(i===q[2])score+=20;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${i===q[2]?'🎉 せいかい！':'🌱 おしい！'}</strong><p>${q[3]}</p></div><button class="next" onclick="next()">${n===4?'けっかを みる 🏆':'つぎの もんだいへ →'}</button>`}function next(){n++;if(n<5)show();else result()}function result(){el.innerHTML=`<section class="panel center"><h2>🏆 けっか はっぴょう！</h2><div class="score">${score} てん！</div><p>${score===100?'すごい！ しょくいく はかせ！':score>=60?'よく がんばったね！':'また ちょうせんしてね！'}</p><button class="next" onclick="start(${level})">もういちど あそぶ</button><button class="next" onclick="home()">ほかの きゅうに ちょうせん</button></section>`}home();
</script></body></html>
